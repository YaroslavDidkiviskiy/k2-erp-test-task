<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Orders</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, sans-serif;
        background: #f4f6f9;
        color: #1a1a2e;
        min-height: 100vh;
      }

      header {
        background: #1a1a2e;
        color: white;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        gap: 2rem;
      }

      header h1 { font-size: 1.4rem; letter-spacing: 0.5px; }

      nav { display: flex; gap: 0.5rem; }

      .tab-btn {
        background: transparent;
        color: #aaa;
        border: 1px solid #444;
        padding: 0.4rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.2s;
      }

      .tab-btn.active, .tab-btn:hover {
        background: #e94560;
        color: white;
        border-color: #e94560;
      }

      main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

      .tab { display: none; }
      .tab.active { display: block; }

      section {
        background: white;
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      }

      h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #1a1a2e; }

      form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; }

      input, select {
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        font-size: 0.9rem;
        flex: 1;
        min-width: 160px;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus, select:focus { border-color: #e94560; }

      button[type="submit"], #add-product-btn, #load-orders-btn {
        background: #e94560;
        color: white;
        border: none;
        padding: 0.5rem 1.2rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.2s;
        white-space: nowrap;
      }

      button[type="submit"]:hover, #add-product-btn:hover, #load-orders-btn:hover {
        background: #c73652;
      }

      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 0.5rem; }
      th { text-align: left; padding: 0.5rem; border-bottom: 2px solid #eee; color: #666; font-weight: 600; }
      td { padding: 0.5rem; border-bottom: 1px solid #f0f0f0; }
      tr:hover td { background: #fafafa; }

      .btn-delete {
        background: transparent;
        border: 1px solid #e94560;
        color: #e94560;
        padding: 0.25rem 0.6rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.2s;
      }
      .btn-delete:hover { background: #e94560; color: white; }

      #selected-products ul { list-style: none; margin-top: 0.75rem; }
      #selected-products li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.3rem 0;
        font-size: 0.9rem;
      }
      .btn-remove {
        background: transparent;
        border: none;
        color: #999;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .btn-remove:hover { color: #e94560; }

      #product-selector { display: flex; gap: 0.5rem; flex-wrap: wrap; width: 100%; }

      #toast {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        padding: 0.75rem 1.25rem;
        border-radius: 6px;
        font-size: 0.9rem;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #toast.success { background: #22c55e; color: white; opacity: 1; }
      #toast.error { background: #e94560; color: white; opacity: 1; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
